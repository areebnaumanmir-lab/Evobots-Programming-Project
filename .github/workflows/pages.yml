# Publishes the evobots website (tools/build_website.py) to GitHub Pages.
# One-time setup by the repository owner: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". The site then updates on every push to main, or when this
# workflow is run by hand (Actions → "Publish website" → Run workflow).
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the site (downloads the pinned, checksum-verified Pyodide files)
        run: uv run python tools/build_website.py --output site_build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
