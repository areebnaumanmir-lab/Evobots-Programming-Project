[project]
name = "evobots"
version = "0.1.0"
description = "evobots: evolving MISO virtual-trading bots with quality-diversity search."
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies are added milestone by milestone (CLAUDE.md §5.2);
# each new one is recorded with its licence in docs/dependencies.md.
dependencies = [
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evobots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Networking is blocked for the whole suite; only localhost is allowed (CLAUDE.md §14.4).
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1 --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# E/F/W: pycodestyle and pyflakes; N: pep8-naming (§14.1); D: docstrings (§14.2); I: import order.
select = ["E", "F", "W", "N", "D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]
